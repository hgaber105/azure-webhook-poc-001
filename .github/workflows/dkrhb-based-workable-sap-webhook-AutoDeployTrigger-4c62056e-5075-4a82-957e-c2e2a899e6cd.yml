name: Trigger auto deployment for dkrhb-based-workable-sap-webhook

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/dkrhb-based-workable-sap-webhook-AutoDeployTrigger-4c62056e-5075-4a82-957e-c2e2a899e6cd.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.DKRHBBASEDWORKABLESAPWEBHOOK_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.DKRHBBASEDWORKABLESAPWEBHOOK_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.DKRHBBASEDWORKABLESAPWEBHOOK_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: docker.io
          registryUsername: ${{ secrets.DKRHBBASEDWORKABLESAPWEBHOOK_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.DKRHBBASEDWORKABLESAPWEBHOOK_REGISTRY_PASSWORD }}
          containerAppName: dkrhb-based-workable-sap-webhook
          resourceGroup: rg-webhook-poc
          imageToBuild: hgaber105/dkrhb-based-workable-sap-webhook:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


