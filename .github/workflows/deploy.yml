name: Build and deploy webhook-poc-001

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write   # required to request the OIDC token
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.WEBHOOKPOC001_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.WEBHOOKPOC001_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.WEBHOOKPOC001_AZURE_SUBSCRIPTION_ID }}

      - name: Build, push and deploy to Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          registryUrl: acrwebhookpoc2026.azurecr.io
          registryUsername: ${{ secrets.WEBHOOKPOC001_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.WEBHOOKPOC001_REGISTRY_PASSWORD }}
          containerAppName: webhook-poc-001
          resourceGroup: rg-webhook-poc
          containerAppEnvironment: cae-webhook-env
          imageToBuild: acrwebhookpoc2026.azurecr.io/webhook-poc-001:${{ github.sha }}
          targetPort: 8080
          ingress: external
