name: Trigger auto deployment for webhook-poc-001

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/webhook-poc-001-AutoDeployTrigger-7743e80f-8c68-47b3-b2ed-5ac90e601dd3.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.WEBHOOKPOC001_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.WEBHOOKPOC001_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.WEBHOOKPOC001_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: acrwebhookpoc2026.azurecr.io
          registryUsername: ${{ secrets.WEBHOOKPOC001_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.WEBHOOKPOC001_REGISTRY_PASSWORD }}
          containerAppName: webhook-poc-001
          resourceGroup: rg-webhook-poc
          imageToBuild: acrwebhookpoc2026.azurecr.io/webhook-poc-001:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


